# Prepares the game day before the report triggers: a full refresh, the backtest, and the fit on its live features.
#
# The daily-report workflow then refreshes only the starters before it predicts. The
# prepare run MUST finish before the next hour in TRIGGER_HOURS_UTC in report_trigger.py.
# It starts after the last late game of the night ends, so its refresh has every result.
name: daily-prepare

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Eastern game day to prepare, YYYY-MM-DD. Empty means today in Eastern time."
        type: string
        default: ""

permissions:
  contents: read

# The same group as daily-report, so only one run writes the cached store at a time.
concurrency:
  group: hockey-model-store
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # The timeout must fit the window from the cron hour to the next trigger hour. The test in
    # tests/test_daily_prepare_workflow.py checks that it does.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
          restore-keys: |
            hockey-model-store-
      - env:
          HOCKEY_MODEL_DB: ${{ runner.temp }}/hockey-model/store.db
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [[ -n "$DISPATCH_DATE" ]]; then
            args+=(--date "$DISPATCH_DATE")
          fi
          bash scripts/daily-prepare.sh ${args[@]+"${args[@]}"}
      # A backup beside the store doubles the cache. After a failed upgrade it also stops the
      # next run at "backup ... already exists", because this save runs even on a failure. The
      # earlier cache entry holds the store that the backup copied.
      - if: always()
        name: Drop the upgrade backup
        run: rm -f "$RUNNER_TEMP"/hockey-model/*.bak
      # Saved even after a failure or an early stop (exit code 75), so a partial backfill resumes
      # on the next run.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
