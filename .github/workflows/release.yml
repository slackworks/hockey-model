name: release

# A tag that starts with v runs the gate. The files are built and published only after the gate
# and the build checks pass. A tag that fails the gate publishes nothing.
on:
  push:
    tags: ["v*"]

permissions: {}

# One run for each tag. A second push of the same tag waits, and it never cancels a publish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag must equal project.version, and CHANGELOG.md must hold a release section for it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # The ancestor check needs the history of main, so the checkout takes every branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag on a commit that never reached main would publish unreviewed code.
      - name: The tagged commit is on main
        env:
          SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "commit $SHA is not on main; merge it, then tag the merge commit" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          uv run python3 scripts/check_release.py --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

  # Builds the files, checks that they name the version, and runs the installed-wheel smoke test.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --no-project python3 scripts/smoke_wheel.py
      - run: uv build --out-dir dist
      - name: Check that the files name the version of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python3 scripts/check_release.py --tag "$TAG" --dist dist --notes-out notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/
            notes.md

  # The only job with write access. It attaches the wheel and the source archive to the GitHub
  # release of the tag. It publishes to no package index.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          bash scripts/publish-release.sh --tag "$TAG" --dist dist --notes notes.md \
            --prerelease "$PRERELEASE"
