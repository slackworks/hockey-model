name: mutation

# The full mutation run is slow and advisory, so it runs weekly and on demand.
# Ordinary pull requests do not run it. Local pre-push checks cover changed code (#76).
on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each ref. A queued run waits, so two runs never write the report.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The registry checker reads the git history of each record.
          fetch-depth: 0
      # The mutmut state is not cached: a weekly run must test the current tests, not reuse old results.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run mutation shard
        timeout-minutes: 25
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # A failed pattern step must stop the shard. An empty list would mutate every module.
          patterns="$(uv run python3 scripts/mutation_shards.py patterns --shard "$SHARD")" || {
            echo "mutation: no patterns for shard $SHARD; see the step log above" >&2
            exit 1
          }
          mapfile -t glob_patterns <<<"$patterns"
          uv run mutmut run "${glob_patterns[@]}"
      - name: Note an unfinished shard
        if: failure() || cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "Shard $SHARD did not finish. Its results are partial." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: mutants/

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      export: ${{ steps.export.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: .tmp/shards
      - name: Merge shard results
        run: uv run python3 scripts/mutation_shards.py merge --from .tmp/shards --into mutants
      - name: Export results
        id: export
        # A failed export is not a failed job. The report step reads this outcome.
        continue-on-error: true
        run: |
          uv run mutmut export-cicd-stats
          uv run mutmut results >mutation-results.txt
      - name: Note a failed export
        if: steps.export.outcome == 'failure'
        run: |
          echo "Export failed. The report step counts this run as an execution failure." >>"$GITHUB_STEP_SUMMARY"
      - name: Note the report scope
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The report is not filed. Only the default branch files reports." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          if-no-files-found: warn
          path: |
            mutation-results.txt
            mutants/mutmut-cicd-stats.json

  report:
    needs: [shard, merge]
    # Only the default branch may write issues. A manual run on another branch skips this job.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHARD_RESULT: ${{ needs.shard.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
      EXPORT_RESULT: ${{ needs.merge.outputs.export }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A missing artifact leaves no stats file. The gate below then counts the run as failed.
        continue-on-error: true
        with:
          name: mutation
          path: .tmp/mutation
      - name: File or update the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stats=.tmp/mutation/mutants/mutmut-cicd-stats.json
          execution=failure
          if [[ "$SHARD_RESULT" == success && "$MERGE_RESULT" == success \
            && "$EXPORT_RESULT" == success && -f "$stats" ]]; then
            execution=success
          fi
          status="$(scripts/report-mutation.sh --stats "$stats" --execution "$execution" --run-url "$RUN_URL")"
          # Only clean and regression pass. A regression does not fail the job here, by design.
          test "$execution" = success
          case "$status" in
            clean | regression) ;;
            *)
              echo "mutation: unexpected report status '$status'" >&2
              exit 1
              ;;
          esac
