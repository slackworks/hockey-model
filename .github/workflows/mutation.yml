name: mutation

# The full mutation run is slow and advisory, so it runs weekly and on demand.
# Ordinary pull requests do not run it. Local pre-push checks cover changed code (#76).
on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The work of this run holds no concurrency group, because the group is where a newer
  # scheduled run would replace a manual run that waits. The next step is the guard that
  # stands aside instead. GitHub keeps one waiting run for a group, and a newer waiting run
  # replaces an older one, so a scheduled run that joined a group would cancel a manual run
  # that waits there (#296), as the gate job of daily-prepare.yml does (#285).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.manual.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: manual
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "schedule" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending="$(bash scripts/manual-prepare-pending.sh mutation.yml)" || {
            echo "::error::The lookup of manual mutation runs failed, so this run stops."
            exit 1
          }
          if [[ "$pending" == "yes" ]]; then
            echo "::warning::A manual mutation run waits or runs, so this run stands aside."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  shard:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The registry checker reads the git history of each record.
          fetch-depth: 0
      # The mutmut state is not cached: a weekly run must test the current tests, not reuse old results.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run mutation shard
        timeout-minutes: 25
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # A failed pattern step must stop the shard. An empty list would mutate every module.
          patterns="$(uv run python3 scripts/mutation_shards.py patterns --shard "$SHARD")" || {
            echo "mutation: no patterns for shard $SHARD; see the step log above" >&2
            exit 1
          }
          mapfile -t glob_patterns <<<"$patterns"
          uv run mutmut run "${glob_patterns[@]}"
      - name: Note an unfinished shard
        if: failure() || cancelled()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "Shard $SHARD did not finish. Its results are partial." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: mutants/

  merge:
    needs: [gate, shard]
    # A gate that stood aside skips the shard job, and a merge of no shard fails. The run then
    # reports an execution failure and files an issue for work it never did (#296). The
    # condition uses !cancelled() and not always(), so a cancelled run files no issue.
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      export: ${{ steps.export.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: .tmp/shards
      - name: Merge shard results
        run: uv run python3 scripts/mutation_shards.py merge --from .tmp/shards --into mutants
      - name: Export results
        id: export
        # A failed export is not a failed job. The report step reads this outcome.
        continue-on-error: true
        run: |
          uv run mutmut export-cicd-stats
          uv run mutmut results >mutation-results.txt
      - name: List the timed-out mutants
        id: timeouts
        # The list is advisory. A failure here is not an export failure, so the report still
        # judges the stats, and the report names a list that is missing.
        if: always()
        continue-on-error: true
        run: uv run python3 scripts/mutation_timeouts.py --out mutants/mutmut-timeouts.json
      - name: Note a failed list
        if: steps.timeouts.outcome == 'failure'
        run: |
          echo "The list of timed-out mutants failed. Its error is in the log of that step." >>"$GITHUB_STEP_SUMMARY"
      - name: Note a failed export
        if: steps.export.outcome == 'failure'
        run: |
          echo "Export failed. The report step counts this run as an execution failure." >>"$GITHUB_STEP_SUMMARY"
      - name: Note the report scope
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The report is not filed. Only the default branch files reports." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          if-no-files-found: warn
          path: |
            mutation-results.txt
            mutants/mutmut-cicd-stats.json
            mutants/mutmut-timeouts.json

  report:
    needs: [gate, shard, merge]
    # The decision runs on every ref, so a manual run judges its own stats. A branch run
    # files nothing, and the file job below runs only on main. A gate that stood aside ran
    # no shard, so there is nothing to judge and no report to file (#296).
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The file job files this decision. It reads no stats of its own, so the two agree.
      status: ${{ steps.decide.outputs.status }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHARD_RESULT: ${{ needs.shard.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
      EXPORT_RESULT: ${{ needs.merge.outputs.export }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        # A missing artifact leaves no stats file. The gate below then counts the run as failed,
        # and its outcome says which of the two causes the report should name.
        continue-on-error: true
        with:
          name: mutation
          path: .tmp/mutation
      - name: Decide the report
        id: decide
        env:
          # A step reads the steps context. A job-level env cannot.
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          stats=.tmp/mutation/mutants/mutmut-cicd-stats.json
          # Each job result reaches the script, so a failed job names itself in the body.
          args=(--stats "$stats" --run-url "$RUN_URL"
            --shard-result "$SHARD_RESULT" --merge-result "$MERGE_RESULT"
            --export-result "$EXPORT_RESULT" --download-result "$DOWNLOAD_RESULT")
          status="$(scripts/report-mutation.sh "${args[@]}")"
          # The status goes to the run summary on every ref, so a branch regression is visible.
          echo "The mutation report status is \`$status\`." >>"$GITHUB_STEP_SUMMARY"
          # A failed run fails the job. A regression does not, by design: the owner decides.
          case "$status" in
            clean | regression) ;;
            execution_failed) echo "status=$status" >>"$GITHUB_OUTPUT"; exit 1 ;;
            *)
              echo "mutation: unexpected report status '$status'" >&2
              exit 1
              ;;
          esac
          echo "status=$status" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The file job needs the body that the decision wrote, so it repeats nothing.
        if: always()
        with:
          name: mutation-report
          if-no-files-found: warn
          path: .tmp/mutation-report.md

  file:
    needs: [gate, shard, merge, report]
    # Only the default branch may write an issue. This job is the only holder of that token.
    # A gate that stood aside leaves no status, and the script rejects an empty one (#296).
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' && github.ref == 'refs/heads/main' }}
    # The script lists the open reports and then creates one, so two file jobs that run
    # together can both find none and both create an issue. The group serializes them. A
    # newer waiting run replaces an older one. The replaced run's report body is dropped, and
    # the newer run files its own body after the same lookup. Only this job joins the group,
    # so the gate still stands aside for a waiting manual run (#296).
    concurrency:
      group: mutation-file-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A missing body means the decision step did not finish. The script then fails.
        continue-on-error: true
        with:
          name: mutation-report
          path: .tmp
      - name: File the report
        env:
          GH_TOKEN: ${{ github.token }}
          # A failed report job leaves no output, and the script rejects an empty status.
          REPORT_STATUS: ${{ needs.report.outputs.status }}
        run: |
          set -euo pipefail
          scripts/report-mutation.sh --status "$REPORT_STATUS" \
            --body .tmp/mutation-report.md --run-url "$RUN_URL" --file-issue >/dev/null

