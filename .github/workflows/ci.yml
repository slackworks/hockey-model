name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the old commit, so cancel it.
# Runs on main are never cancelled, so each merge keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validation
    steps:
      # The registry checker reads the git history of each record.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Restores the uv download cache from the lock file key, so a repeat run skips downloads.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: rm -f coverage.json
      - run: uv run pytest
      - run: uv run python3 scripts/check_per_module_coverage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          if-no-files-found: error
          path: |
            lcov.info
            coverage.json

  editorconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install editorconfig-checker
        run: |
          EC_VERSION=v4.0.2
          EC_SHA256=44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
          # RUNNER_TEMP belongs to this job, so no other process can swap the archive
          # between the digest check and the extract.
          archive="$RUNNER_TEMP/ec.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/${EC_VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "${EC_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin editorconfig-checker
      - run: editorconfig-checker

  # Builds the wheel and runs it from a clean venv, so a missing package-data file or entry point
  # fails here. The source-tree jobs above cannot see that.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python3 scripts/smoke_wheel.py
      # The probe drops one file from the wheel. The smoke test must then fail at a check, which
      # is exit 1. Exit 2 is a setup failure, and exit 0 is a test that missed the gap.
      - name: Smoke test fails when a package-data file or the entry point is missing
        run: |
          for name in schema.sql views.sql entry_points.txt; do
            code=0
            uv run --no-project python3 scripts/smoke_wheel.py --drop "$name" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "probe $name: expected exit 1 from a failed check, got $code" >&2
              exit 1
            fi
          done

  # Keep ZIZMOR_VERSION equal to the zizmor hook rev in .pre-commit-config.yaml.
  # The job gets no token, so zizmor runs offline as the local hook does. An unhashed PyPI
  # download then never sees a credential.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx "zizmor==${ZIZMOR_VERSION}" --no-progress .github/workflows
