# Publishes the daily NHL prediction report as a dated GitHub release.
#
# The schedule fires at each trigger slot. The gate job publishes at the first slot that runs
# while the day's first puck drop is still ahead. Each later slot before the puck drop replaces
# the release files and notes. After the puck drop, a run skips a published day, and a run that
# finds no release publishes the first report of the day late. The cron minute and hours
# MUST match TRIGGER_MINUTE_UTC and TRIGGER_HOURS_UTC in report_trigger.py.
name: daily-report

on:
  schedule:
    - cron: "44 0,11,15-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish now, even outside the trigger slot. A published day is still skipped."
        type: boolean
        default: false
      dry_run:
        description: "Build the report and upload it as an artifact, but do not publish a release. A published day is built again. The store cache is still saved."
        type: boolean
        default: false

# One budget for the whole workflow. The gate reserves it before the build starts, on time or late, and the report
# step enforces it.
env:
  REPORT_BUDGET_S: "600"

permissions:
  contents: read

# The same group as daily-prepare, so only one run writes the cached store at a time.
concurrency:
  group: hockey-model-store
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.gate.outputs.due }}
      publish: ${{ steps.gate.outputs.publish }}
      day: ${{ steps.gate.outputs.day }}
    steps:
      - name: Start the job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_FORCE: ${{ inputs.force }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DISPATCH_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "$DISPATCH_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          args+=(--margin-seconds "$REPORT_BUDGET_S")
          bash scripts/report-gate.sh ${args[@]+"${args[@]}"} > gate.json
          cat gate.json
          {
            echo "due=$(jq -r '.due' gate.json)"
            echo "publish=$(jq -r '.publish' gate.json)"
            echo "day=$(jq -r '.date' gate.json)"
          } >> "$GITHUB_OUTPUT"
          echo "Report gate for $(jq -r '.date' gate.json): $(jq -r '.reason' gate.json)" >> "$GITHUB_STEP_SUMMARY"
      # The overhead of each job is measured here, so the trigger lead can be set from data.
      - if: always()
        name: Report the job time
        run: echo "::notice::gate job took $(( $(date +%s) - JOB_START ))s"

  build:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DAY: ${{ needs.gate.outputs.day }}
    outputs:
      report_complete: ${{ steps.state.outputs.report_complete }}
    steps:
      - name: Start the job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # The store is restored from the newest save and saved again after the run. A cache
      # miss, or a store without the prepared marker of the day, fails the run: run the
      # daily-prepare workflow for the day first.
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
          restore-keys: |
            hockey-model-store-
      # GitHub scopes a cache to its branch, so a prepare run from another branch is not found.
      # An empty matched key means nothing was restored.
      - if: steps.restore.outputs.cache-matched-key == ''
        run: |
          echo "::error::No store cache found for this branch. Run daily-prepare on main for $DAY first." >&2
          exit 1
      - env:
          HOCKEY_MODEL_DB: ${{ runner.temp }}/hockey-model/store.db
        # The step limit stops a hung read while the job still holds the store group. The budget
        # that the script enforces is REPORT_BUDGET_S above.
        timeout-minutes: 15
        run: bash scripts/daily-report.sh --date "$DAY" --out-dir "$RUNNER_TEMP/report"
      # The script writes the complete marker only after every output file is copied. The
      # publish job reads this output, so a report cut short by a crash is never published.
      - id: state
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/report/complete" ]]; then
            echo "report_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_complete=false" >> "$GITHUB_OUTPUT"
          fi
      # Runs even when the report step failed, so a report written before the budget check
      # is still uploaded. The publish job then fails at the download if nothing was written.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-report
          if-no-files-found: warn
          path: ${{ runner.temp }}/report
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/hockey-model
          key: hockey-model-store-${{ github.run_id }}
      - if: always()
        name: Report the job time
        run: echo "::notice::build job took $(( $(date +%s) - JOB_START ))s"

  publish:
    needs: [gate, build]
    # Publishes only a complete report. A build that overran the budget still publishes, and
    # the build job stays failed, so the overrun remains visible. A crash never publishes.
    if: >-
      always() && needs.gate.outputs.publish == 'true'
      && needs.build.outputs.report_complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DAY: ${{ needs.gate.outputs.day }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daily-report
          path: ${{ runner.temp }}/report
      - run: bash scripts/publish-daily-report.sh --date "$DAY" --report-dir "$RUNNER_TEMP/report"
      - if: always()
        name: Report the job time
        run: echo "::notice::publish job took $(( $(date +%s) - JOB_START ))s"
