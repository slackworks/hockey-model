[project]
name = "hockey-model"
version = "0.1.0"
description = "Player stat rate and game win models for hockey"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hockey-model = "hockey_model.cli:main"

[dependency-groups]
dev = [
    "hypothesis~=6.170.14",
    "mutmut~=3.8.1",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.3",
    "ty~=0.0.95",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
    --cov=hockey_model
    --cov-report=term-missing
    --cov-report=lcov:lcov.info
    --cov-report=json:coverage.json
    --cov-fail-under=80
"""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mutmut]
source_paths = ["src"]
# The parsers and the rate math: pure functions whose tests need a strong oracle.
only_mutate = [
    "src/hockey_model/backtest/metrics.py",
    "src/hockey_model/experiments/models.py",
    "src/hockey_model/game_model/elo.py",
    "src/hockey_model/game_model/logistic.py",
    "src/hockey_model/sources/*.py",
]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
# mutmut stops a hung mutant at a CPU time limit of (test time + 1) * multiplier * 2 seconds.
# A low multiplier keeps a changed function that hangs under MUTMUT_TIMEOUT_S in
# scripts/pre_push_mutation.py (#175, #210). A loaded host can show a slow mutant as a timeout.
timeout_multiplier = 3.0
