# A normal `prek install` then installs the pre-push stage too, so the coverage gate runs.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: 0adfdb012938ada0cf563a40f2fceaf9466290ca # frozen: v4.0.2
    hooks:
      - id: editorconfig-checker

  # Keep this version equal to ZIZMOR_VERSION in .github/workflows/ci.yml, so both run one policy.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: coverage-gate
        name: pytest coverage and per-module floor
        # One chained command, so a failed pytest run never leaves a stale report for the floor check.
        entry: bash -c 'rm -f coverage.json && uv run pytest && uv run python3 scripts/check_per_module_coverage.py'
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
      - id: mutation-changed
        name: mutation tests on changed functions
        # Runs only when the push holds a covered-source change. A docs-only push skips it.
        entry: uv run python3 scripts/pre_push_mutation.py run
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
